name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  # The browser tests run one at a time, because each test starts the one fake erp-api's
  # data over. So they're split across machines instead, each with its own build and fake.
  e2e:
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The production build, on its own so a failure shows here. It points at
      # the fake erp-api with a test-only session key, the same settings as
      # `playwright.config.ts`, which then starts this build without rebuilding.
      - run: npm run build
        env:
          ERP_API_URL: http://localhost:4010
          NEXT_PUBLIC_ERP_API_URL: http://localhost:4010
          SESSION_SECRET: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

      - run: npx playwright install --with-deps chromium webkit

      - run: npm run e2e -- --shard=${{ matrix.shard }}/2

      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # One result for branch protection, under the name it already requires.
  all:
    name: Lint, types, tests and browser tests
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.e2e.result }}" = success
