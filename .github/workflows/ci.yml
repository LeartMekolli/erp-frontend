name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The browser tests build AMI themselves (`playwright.config.ts`), against
      # the fake erp-api with a test-only session key, so no secrets are needed.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run e2e

      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
